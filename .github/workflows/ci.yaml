name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', 'flake.lock', 'server/Cargo.lock', 'client/pnpm-lock.yaml', 'client/pnpm-deps.hash') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 8G
      - name: Evaluation of every flake output
        run: nix flake check --no-build --option abort-on-warn true
      - name: Lint
        run: nix build --print-build-logs --no-link --option abort-on-warn true .#checks.x86_64-linux.lint
      - name: Build
        run: nix build --print-build-logs --no-link --option abort-on-warn true .#checks.x86_64-linux.build
      - name: Unit tests
        run: nix build --print-build-logs --no-link --option abort-on-warn true .#checks.x86_64-linux.test
      - name: Integration tests
        run: nix build --print-build-logs --no-link --option abort-on-warn true .#checks.x86_64-linux.integration
      - name: Release binary
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft
        run: nix build --print-build-logs --out-link release --option abort-on-warn true .#packages.x86_64-linux.release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft
        with:
          name: adunata-x86_64-linux
          path: release/adunata
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: End-to-end tests
    needs: verify
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: adunata-x86_64-linux
          path: ${{ runner.temp }}/release
      - name: Executable bit of the release binary
        run: chmod +x "$RUNNER_TEMP/release/adunata"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: Dependencies
        run: pnpm install --frozen-lockfile
      - name: Version of Playwright
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Chromium with its system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        env:
          ADUNATA_E2E_SERVER: ${{ runner.temp }}/release/adunata
        run: pnpm run e2e
      - name: Output of the services
        if: failure()
        run: cat test-results/services.log test-results/server.log || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-results
          path: client/test-results
          retention-days: 7

  nixos:
    name: NixOS
    needs: verify
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Allow virtual machines
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', 'flake.lock', 'server/Cargo.lock', 'client/pnpm-lock.yaml', 'client/pnpm-deps.hash') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: false
      - name: NixOS VM test
        run: nix build --print-build-logs --no-link --option abort-on-warn true .#checks.x86_64-linux.nixosVmTest
