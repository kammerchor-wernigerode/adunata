[package]
name = "adunata"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
axum = "0.8.9"
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
