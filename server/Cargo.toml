[package]
name = "adunata"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
axum = "0.8.9"
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "derive", "time"] }
time = { version = "0.3.55", features = ["serde", "macros"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread"] }
utoipa = { version = "6.0.0", features = ["time", "preserve_order"] }
utoipa-axum = "0.3.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
