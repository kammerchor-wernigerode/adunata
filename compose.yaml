name: adunata

services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: adunata
      POSTGRES_PASSWORD: adunata
      POSTGRES_DB: adunata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "adunata"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres:
